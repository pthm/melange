name: CI - Internal Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          cache: true

      # Per-job caches keyed by commit: main saves a fresh one each run (an
      # exact-key hit never saves, which froze a shared cache), and PRs restore
      # the newest from main.
      - name: Restore Go cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-lint-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-lint-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-lint-

      - name: Setup Go workspace
        run: go work init . ./cmd/melange ./docs ./melange ./test

      - name: Install tools
        run: go install tool

      - name: Check studio templates are generated
        run: |
          go tool templ fmt -fail internal/studio
          for f in internal/studio/*_templ.go; do [ -f "${f%_templ.go}.templ" ] || { echo "orphaned $f"; exit 1; }; done
          go tool templ generate -check -path internal/studio

      - name: Generate test authz package
        run: go run . generate client --runtime go --schema test/testutil/testdata/schema.fga --output test/authz/ --package authz --id-type int64

      - name: Lint all modules
        run: |
          # Uses golangci-lint version pinned in go.mod via tool directive
          # After `go install tool`, binary is in $GOPATH/bin which is in PATH
          golangci-lint run ./...
          cd melange && golangci-lint run ./...
          cd ../cmd/melange && golangci-lint run ./...
          cd ../../test && golangci-lint run ./...

      - name: Save Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-lint-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          cache: true

      # Per-job caches keyed by commit: main saves a fresh one each run (an
      # exact-key hit never saves, which froze a shared cache), and PRs restore
      # the newest from main.
      - name: Restore Go cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-unit-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-unit-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-unit-

      - name: Setup Go workspace
        run: go work init . ./cmd/melange ./docs ./melange ./test

      - name: Generate test authz package
        run: go run . generate client --runtime go --schema test/testutil/testdata/schema.fga --output test/authz/ --package authz --id-type int64

      - name: Run unit tests (root module)
        run: go test -short -race -coverprofile=coverage-root.out -covermode=atomic ./...

      - name: Run unit tests (melange core module)
        working-directory: melange
        run: go test -short -race -coverprofile=coverage-runtime.out -covermode=atomic ./...

      # cmd/melange is now a stdlib-only error-shim with no tests — nothing to run.

      - name: Install TypeScript dependencies
        working-directory: clients/typescript
        run: pnpm install

      - name: Run TypeScript unit tests
        working-directory: clients/typescript
        run: pnpm test:unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-root.out,./melange/coverage-runtime.out
          flags: unit
          fail_ci_if_error: false

      - name: Save Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-unit-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  integration-tests:
    name: Integration Tests (Go + TypeScript)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          cache: true

      # Per-job caches keyed by commit: main saves a fresh one each run (an
      # exact-key hit never saves, which froze a shared cache), and PRs restore
      # the newest from main.
      - name: Restore Go cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-integration-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-integration-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-integration-

      - name: Setup Go workspace
        run: go work init . ./cmd/melange ./docs ./melange ./test

      - name: Generate test authz package
        run: go run . generate client --runtime go --schema test/testutil/testdata/schema.fga --output test/authz/ --package authz --id-type int64

      - name: Install TypeScript dependencies
        working-directory: clients/typescript
        run: pnpm install

      - name: Run Go integration tests
        working-directory: test
        # openfgatests runs in the OpenFGA workflow (same -race and coverage,
        # uploaded under the same flag); running it here too doubled this job.
        run: go test -timeout 5m -race -p 1 -parallel 1 -coverprofile=coverage-integration.out -covermode=atomic -coverpkg=github.com/pthm/melange/... $(go list ./... | grep -v /openfgatests)

      - name: Run TypeScript integration tests
        working-directory: clients/typescript
        run: pnpm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test/coverage-integration.out
          flags: integration
          fail_ci_if_error: false

      - name: Save Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-integration-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
