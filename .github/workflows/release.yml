name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version, vX.Y.Z only (e.g. v0.9.0). Leave blank for normal release-please flow."
        required: false
        default: ""
      dry_run:
        description: "Exercise the release flow without pushing tags, publishing, or mutating anything externally"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  # Required for OIDC trusted publishing to npm — pnpm fetches a GitHub-issued
  # ID token at publish time and exchanges it with npm for an ephemeral
  # publishing credential. No static NPM_TOKEN needed.
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      body: ${{ steps.rp.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The `release` job creates the tag/GitHub release after bumping go.mod,
          # so we don't let release-please do it here (the tag would otherwise sit
          # on a commit whose go.mod still references the previous melange/ runtime).
          skip-github-release: true

  release:
    needs: release-please
    # Fire on three signals:
    #   1. release-please-action set release_created (default flow when it owns the tag)
    #   2. manual workflow_dispatch (recovery / forced cuts)
    #   3. push to main where the head commit is a release-please release-PR merge.
    #      Required because we run release-please-action with skip-github-release: true
    #      so it can manage PRs without owning the tag — its release_created output
    #      doesn't fire in that mode (it aborts with "untagged outstanding"), so we
    #      detect the merge by the commit-message convention release-please uses.
    if: |
      needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore(main): release '))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version and announce mode
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            version="$DISPATCH_VERSION"
          elif [ -n "$RP_TAG" ]; then
            version="$RP_TAG"
          else
            # release-please subject format: "chore(main): release 0.8.2"
            # Appears on line 1 for squash-merged release PRs and on a later
            # line (after the "Merge pull request #N …" subject) for classic
            # merge commits, so scan the whole message rather than just line 1.
            subject=$(printf '%s\n' "$COMMIT_MSG" | grep -E '^chore(\([^)]*\))?: release ' | head -n 1)
            version=$(printf '%s' "$subject" | awk -F': release ' '{print $2}' | awk '{print $1}')
            if [ -z "$version" ]; then
              echo "❌ Could not extract version from commit message:"
              printf '%s\n' "$COMMIT_MSG" >&2
              exit 1
            fi
            # release-please writes the version without a leading v; canonicalise.
            if [ "${version#v}" = "$version" ]; then
              version="v$version"
            fi
          fi
          if ! printf '%s' "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            # Stable releases only: scripts/verify-release.sh rejects anything
            # else, and failing here stops us before any tag is pushed.
            echo "❌ VERSION must be vX.Y.Z (prereleases are not supported), got: $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice title=Dry run::Releasing $version in DRY RUN mode — no tags or publishes will leave the runner."
          else
            echo "::notice title=Release::Releasing $version"
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "melange-release-bot"
          git config user.email "melange-release-bot@users.noreply.github.com"

      # mise.toml pins go, goreleaser, node, pnpm, and quill (via ubi backend)
      # — one source of truth for tooling between local dev and CI.
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          cache: true

      - name: Cache Go modules and build
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # No go.work needed: goreleaser builds the root module (main: .), which
      # resolves the runtime (melange/) from the proxy after the bump step below,
      # and the genproto replace now lives in root go.mod. The old workspace shim
      # existed only to build the separate cmd/melange module.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag melange/ runtime
        run: |
          melange_tag="melange/${VERSION}"
          if git ls-remote --tags origin | grep -q "refs/tags/${melange_tag}$"; then
            echo "✓ remote tag ${melange_tag} already exists — skipping"
            exit 0
          fi
          git tag -a "${melange_tag}" -m "${melange_tag}"
          if [ "$DRY_RUN" = "true" ]; then
            git push --dry-run origin "${melange_tag}"
            echo "↪ dry-run: ${melange_tag} tag created locally only"
          else
            git push origin "${melange_tag}"
          fi

      - name: Wait for goproxy to index melange/
        if: env.DRY_RUN != 'true'
        run: |
          for i in $(seq 1 30); do
            if GOPROXY=https://proxy.golang.org go list -m "github.com/pthm/melange/melange@${VERSION}" >/dev/null 2>&1; then
              echo "✓ melange/${VERSION} indexed"
              exit 0
            fi
            echo "  waiting for goproxy... (${i}/30)"
            sleep 10
          done
          echo "❌ goproxy did not index melange/${VERSION} within 5 minutes"
          exit 1

      - name: Bump root go.mod and push
        if: env.DRY_RUN != 'true'
        run: |
          go mod edit -require="github.com/pthm/melange/melange@${VERSION}"
          GOPROXY=https://proxy.golang.org go mod tidy
          if git diff --quiet go.mod go.sum; then
            echo "✓ root go.mod already references melange/${VERSION}"
          else
            git add go.mod go.sum
            git commit -m "chore(release): bump root go.mod to melange/${VERSION}"
            git push origin HEAD:main
          fi

      - name: Bump root go.mod (dry run preview)
        if: env.DRY_RUN == 'true'
        run: |
          # The new melange/ tag wasn't pushed, so `go mod tidy` against it would fail.
          # Run only `go mod edit` to verify the bump syntax and show the diff.
          go mod edit -require="github.com/pthm/melange/melange@${VERSION}"
          echo "↪ dry-run: would bump root go.mod (skipping tidy since tag was not pushed)"
          git diff go.mod || true
          # Restore for any later steps that read go.mod
          git checkout -- go.mod

      - name: Tag root release
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            echo "✓ remote tag ${VERSION} already exists — skipping"
            exit 0
          fi
          git tag -a "${VERSION}" -m "${VERSION}"
          if [ "$DRY_RUN" = "true" ]; then
            git push --dry-run origin "${VERSION}"
            echo "↪ dry-run: ${VERSION} tag created locally only"
          else
            git push origin "${VERSION}"
          fi

      # Goreleaser requires HEAD to match the release tag. After idempotent
      # re-runs (or if main has advanced past the tag for any reason), HEAD
      # may diverge — switch to the tag so goreleaser sees a matching state.
      - name: Switch to release tag
        run: |
          git fetch origin "refs/tags/${VERSION}:refs/tags/${VERSION}" 2>/dev/null || true
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            git checkout "${VERSION}"
          fi

      # Write release notes outside the repo so goreleaser's "git is dirty"
      # validation pipe doesn't trip. Snapshot mode skips that pipe; real
      # release mode does not.
      - name: Write release notes for goreleaser
        run: |
          notes_path="${RUNNER_TEMP}/release-notes.md"
          echo "RELEASE_NOTES_PATH=${notes_path}" >> "$GITHUB_ENV"
          cat <<'NOTES_EOF' > "${notes_path}"
          ${{ needs.release-please.outputs.body }}
          NOTES_EOF
          # Fallback for workflow_dispatch (no release-please body): extract from CHANGELOG.md
          if [ ! -s "${notes_path}" ]; then
            awk -v ver="${VERSION#v}" '
              /^## \[/ { if (found) exit; found = ($0 ~ "\\["ver"\\]") ? 1 : 0; if (found) next }
              found { print }
            ' CHANGELOG.md > "${notes_path}" || true
          fi

      - name: Run goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          QUILL_SIGN_P12: ${{ secrets.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.QUILL_SIGN_PASSWORD }}
          QUILL_NOTARY_KEY: ${{ secrets.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.QUILL_NOTARY_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.QUILL_NOTARY_ISSUER }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            goreleaser release --snapshot --clean --skip=publish --release-notes "$RELEASE_NOTES_PATH"
          else
            goreleaser release --clean --release-notes "$RELEASE_NOTES_PATH"
          fi

      # Publishes via OIDC trusted publisher (configured on npmjs.com against
      # this repo + workflow file). No static NPM_TOKEN involved — pnpm fetches
      # an ID token from GitHub at publish time and exchanges it with npm for
      # an ephemeral credential. Requires `id-token: write` at the job level.
      - name: Publish to npm
        run: |
          cd clients/typescript
          pnpm install --frozen-lockfile
          pnpm build
          if [ "$DRY_RUN" = "true" ]; then
            # `pnpm publish --dry-run` still hits the registry's version-collision
            # check, which fails because dry-runs don't bump package.json. Pack
            # the tarball locally instead — exercises the build + files glob
            # without any registry interaction.
            echo "↪ dry-run: building and packing tarball..."
            pnpm pack
            echo "↪ dry-run: tarball created at clients/typescript/$(ls -1t *.tgz | head -1)"
            exit 0
          fi
          # Idempotent: skip if this version is already on the registry
          if npm view "@pthm/melange@${VERSION#v}" version >/dev/null 2>&1; then
            echo "✓ @pthm/melange@${VERSION#v} already published"
          else
            pnpm publish --access public --no-git-checks
          fi

      # No cmd/melange stage: the CLI ships from the root module (tagged above).
      # cmd/melange is a retired error-shim published once as a terminal manual
      # tag, not on every release — see specs/module-layout-proposal.md.

      - name: Smoke-test go install (post-publish)
        if: env.DRY_RUN != 'true'
        run: |
          # End-to-end check that the published module is actually installable —
          # catches replace/exclude directives or other module-graph issues that
          # only surface against the real proxy (a stray replace broke this in
          # v0.9.0). The release is already published here, so a failure means
          # "roll forward with a fix", not "abort" — but it fails loudly.
          echo "Waiting for goproxy to index ${VERSION}..."
          for i in $(seq 1 30); do
            if GOPROXY=https://proxy.golang.org go list -m "github.com/pthm/melange@${VERSION}" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          bindir="$(mktemp -d)"
          if ! GOBIN="$bindir" GOPROXY=https://proxy.golang.org go install "github.com/pthm/melange@${VERSION}"; then
            echo "❌ 'go install github.com/pthm/melange@${VERSION}' FAILED — the CLI install path is broken. Roll forward with a fix."
            exit 1
          fi
          if ! "$bindir/melange" version | grep -q "${VERSION#v}"; then
            echo "❌ installed binary did not report ${VERSION}:"
            "$bindir/melange" version
            exit 1
          fi
          echo "✓ go install github.com/pthm/melange@${VERSION} works: $("$bindir/melange" version | head -1)"

      # release-please tracks the lifecycle of its own release PRs via two
      # labels: `autorelease: pending` (PR merged, tag not yet created) and
      # `autorelease: tagged` (release complete). When release-please owns
      # the tag, it moves the label automatically; we own the tag, so we
      # have to do it. Without this, the next release-please run finds a
      # PR labelled `pending`, decides there's an outstanding untagged
      # release, and refuses to open the next release PR.
      - name: Mark release-please PR as tagged
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          # gh's --search uses GitHub's search syntax, which tokenises on
          # parentheses — `chore(main):` doesn't match as a phrase. Fetch the
          # latest merged release-please PRs and filter locally on the exact
          # title for a clean equality check.
          expected_title="chore(main): release ${VERSION#v}"
          pr_number=$(gh pr list \
            --state merged \
            --label "autorelease: pending" \
            --limit 20 \
            --json number,title \
            --jq ".[] | select(.title == \"${expected_title}\") | .number" \
            | head -n 1)
          if [ -z "$pr_number" ]; then
            echo "↪ no release-please PR found with title '${expected_title}' (likely a workflow_dispatch cut) — skipping label update"
            exit 0
          fi
          gh pr edit "$pr_number" \
            --remove-label "autorelease: pending" \
            --add-label "autorelease: tagged"
          echo "✓ PR #${pr_number} relabelled: pending → tagged"

  # Installs the just-published release through each package channel the
  # docs advertise and checks the binary reports it. Like the go install
  # smoke test, the release is already out, so a failure means "roll
  # forward with a fix". The tap and bucket are cloned fresh, but retry
  # briefly in case a mirror is still serving the previous manifest.
  verify-install-channels:
    needs: release
    if: ${{ !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Smoke-test deb and Docker image
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # goreleaser stamps the version without the leading v.
          expected="melange ${VERSION#v} ("
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "melange_${VERSION#v}_linux_amd64.deb" --dir "$RUNNER_TEMP"
          sudo dpkg -i "$RUNNER_TEMP/melange_${VERSION#v}_linux_amd64.deb"
          if ! /usr/bin/melange version | grep -qF "$expected"; then
            echo "❌ deb-installed melange did not report ${VERSION}:"
            /usr/bin/melange version
            exit 1
          fi
          echo "✓ deb install works: $(/usr/bin/melange version)"
          image="ghcr.io/pthm/melange:${VERSION}"
          if ! docker run --rm "$image" version | grep -qF "$expected"; then
            echo "❌ ${image} did not report ${VERSION}:"
            docker run --rm "$image" version
            exit 1
          fi
          echo "✓ ${image} works: $(docker run --rm "$image" version)"

      - name: Smoke-test Homebrew cask
        if: runner.os == 'macOS'
        run: |
          brew tap pthm/tap
          for i in $(seq 1 5); do
            if [ "$i" -gt 1 ]; then
              echo "  tap has ${cask_version}, waiting for ${VERSION#v}... (${i}/5)"
              sleep 30
              git -C "$(brew --repo pthm/tap)" pull --quiet
            fi
            cask_version=$(brew info --cask --json=v2 pthm/tap/melange | jq -r '.casks[0].version')
            [ "$cask_version" = "${VERSION#v}" ] && break
          done
          if [ "$cask_version" != "${VERSION#v}" ]; then
            echo "❌ pthm/homebrew-tap still has melange ${cask_version}, expected ${VERSION#v} — check goreleaser's homebrew_casks publish."
            exit 1
          fi
          brew install --cask pthm/tap/melange
          if ! melange version | grep -qF "melange ${VERSION#v} ("; then
            echo "❌ brew-installed melange did not report ${VERSION}:"
            melange version
            exit 1
          fi
          echo "✓ brew install pthm/tap/melange works: $(melange version)"

      - name: Smoke-test Scoop manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Runners are admin, which the Scoop installer refuses without -RunAsAdmin.
          Invoke-RestMethod https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add pthm https://github.com/pthm/scoop-bucket
          $bucket = "$env:USERPROFILE\scoop\buckets\pthm"
          $want = $env:VERSION.TrimStart('v')
          foreach ($i in 1..5) {
            if ($i -gt 1) {
              Write-Host "  bucket has $have, waiting for $want... ($i/5)"
              Start-Sleep -Seconds 30
              git -C $bucket pull --quiet
            }
            $have = (Get-Content "$bucket\melange.json" -Raw | ConvertFrom-Json).version
            if ($have -eq $want) { break }
          }
          if ($have -ne $want) {
            Write-Host "❌ pthm/scoop-bucket still has melange $have, expected $want — check goreleaser's scoops publish."
            exit 1
          }
          scoop install pthm/melange
          $out = melange version
          if (-not "$out".Contains("melange $want (")) {
            Write-Host "❌ scoop-installed melange did not report $($env:VERSION):"
            Write-Host $out
            exit 1
          }
          Write-Host "✓ scoop install pthm/melange works: $out"
