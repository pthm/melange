# golangci-lint configuration
# Run: golangci-lint run ./...

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - prealloc
    - unconvert
    - unparam
    - revive
  settings:
    revive:
      rules:
        # Require doc comments on exported symbols and a package comment.
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
    misspell:
      locale: US
    prealloc:
      simple: true
      for-loops: true
  exclusions:
    rules:
      # Doc comments are only required on the public API surface, not on
      # internal/ (unimportable externally) or test files.
      - path: (internal/|_test\.go)
        linters:
          - revive
      # Allow unchecked errors in tests
      - path: _test\.go
        linters:
          - errcheck
      # Allow unused parameters in test helpers
      - path: test/
        linters:
          - unparam
      # SQL generator has many builder functions with consistent signatures
      # Parameters are kept for API consistency even when not all are used
      - path: internal/sqlgen/
        linters:
          - unparam

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
