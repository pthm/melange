# Hugo configuration file for Melange documentation
title: Melange
baseURL: https://melange.sh/

# Use hextra theme from Hugo Modules
module:
  imports:
    - path: github.com/imfing/hextra

enableRobotsTXT: true
enableGitInfo: true

# Machine-readable outputs: /llms.txt indexes the docs for LLM agents,
# /llms-full.txt is every docs page in one file, and every page gets a
# markdown twin at <page>.md (layouts/_partials/llms/markdown-body.html).
outputFormats:
  llmsfull:
    baseName: llms-full
    mediaType: text/plain
    isPlainText: true

outputs:
  home: [HTML, RSS, llms, llmsfull]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

defaultContentLanguage: en
languages:
  en:
    languageName: English
    weight: 1

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Updates
      pageRef: /blog
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/pthm/melange"
      params:
        icon: github

params:
  description: Zero-copy authorization for PostgreSQL - OpenFGA-compatible permission checking that queries your existing domain tables directly.
  # Default og:image / twitter:image for pages without their own `images`.
  images: [images/og.png]

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/melange-dark.png
      dark: images/melange-light.png
      width: 120
      height: 24
    width: wide

  page:
    width: wide
    tabs:
      sync: true

  footer:
    displayCopyright: false
    displayPoweredBy: true
    width: wide

  editURL:
    enable: true
    base: "https://github.com/pthm/melange/edit/main/docs/content"

  blog:
    list:
      displayTags: true

  comments:
    enable: false
