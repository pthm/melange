# Hugo configuration file for Melange documentation
title: Melange
baseURL: https://melange.sh/

# Use hextra theme from Hugo Modules
module:
  imports:
    - path: github.com/imfing/hextra

enableRobotsTXT: true
enableGitInfo: true

# Machine-readable outputs: /llms.txt indexes the docs for LLM agents,
# /llms-full.txt is every docs page in one file, and every page gets a
# markdown twin at <page>.md (layouts/_partials/llms/markdown-body.html).
outputFormats:
  llmsfull:
    baseName: llms-full
    mediaType: text/plain
    isPlainText: true

outputs:
  home: [HTML, RSS, llms, llmsfull]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

defaultContentLanguage: en
languages:
  en:
    label: English
    weight: 1

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Updates
      pageRef: /blog
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/pthm/melange"
      params:
        icon: github

params:
  description: Fine-grained, relationship-based access control without an external service. Melange compiles OpenFGA schemas into SQL functions that run inside your existing PostgreSQL database.
  # Default og:image / twitter:image for pages without their own `images`.
  images: [images/og.png]

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/melange-dark.png
      dark: images/melange-light.png
      width: 120
      height: 24
    width: wide

  page:
    width: wide
    tabs:
      sync: true
    # "Copy page" menu on docs pages: copy or view the page's Markdown twin,
    # or hand it to an assistant. Placeholders are URL-encoded by Hextra.
    contextMenu:
      enable: true
      links:
        - name: Open in Claude
          icon: simple:claude
          url: "https://claude.ai/new?q=Read%20{markdown_url}%20so%20I%20can%20ask%20questions%20about%20it."
        - name: Open in ChatGPT
          icon: lucide:message-circle
          url: "https://chatgpt.com/?q=Read%20{markdown_url}%20so%20I%20can%20ask%20questions%20about%20it."

  footer:
    displayCopyright: false
    displayPoweredBy: true
    width: wide

  editURL:
    enable: true
    base: "https://github.com/pthm/melange/edit/main/docs/content"

  blog:
    list:
      displayTags: true

  comments:
    enable: false
