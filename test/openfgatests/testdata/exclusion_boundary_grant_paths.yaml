            expectation: []
          - name: alice_lists_a_mixed
            request: { user: user:alice, type: document, relation: a_mixed }
            expectation: [document:1]
          - name: mallory_lists_a_mixed
            request: { user: user:mallory, type: document, relation: a_mixed }
            expectation: []
          - name: alice_lists_u_mixed
            request: { user: user:alice, type: document, relation: u_mixed }
            expectation: [document:1]
          - name: mallory_lists_u_mixed
            request: { user: user:mallory, type: document, relation: u_mixed }
            expectation: []
          - name: alice_lists_a_via_parent
            request: { user: user:alice, type: document, relation: a_via_parent }
            expectation: [document:1]
          - name: mallory_lists_a_via_parent
            request: { user: user:mallory, type: document, relation: a_via_parent }
            expectation: []
          - name: alice_lists_a_ug
            request: { user: user:alice, type: document, relation: a_ug }
            expectation: [document:1]
          - name: mallory_lists_a_ug
            request: { user: user:mallory, type: document, relation: a_ug }
            expectation: []
          - name: alice_lists_a_int
            request: { user: user:alice, type: document, relation: a_int }
            expectation: [document:1]
          - name: mallory_lists_a_int
            request: { user: user:mallory, type: document, relation: a_int }
            expectation: []
          - name: alice_lists_u_int
