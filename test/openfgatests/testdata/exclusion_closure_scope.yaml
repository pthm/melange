# Regression: an exclusion belongs to the relation that defines it. Closure
# exclusions were promoted to the enclosing relation, so final: can_read but
# not d also applied reader's "but not b" and denied a valid c grant
# (user6: b and c; user7: a, b and c). Found by FuzzAuthorizationAlgebra.
#
# userN holds the tuples in the bits of N: 1=a, 2=b, 4=c, 8=d. The complex
# variant reaches b and d through computed relations. Mirrors
# test/check_exclusion_scope_test.go, which also covers check_permission_nw.
  - name: exclusion_scope_direct
    stages:
      - model: |
          model
            schema 1.1

          type user

          type document
            relations
              define a: [user]
              define b: [user]
              define c: [user]
              define d: [user]
              define branch_blocked: b
              define outer_blocked: d
              define reader: a but not b
              define can_read: reader or c
              define final: can_read but not d
              define alias: final
        tuples:
          - user: user:user1
            relation: a
            object: document:doc
          - user: user:user2
            relation: b
            object: document:doc
          - user: user:user3
            relation: a
            object: document:doc
          - user: user:user3
            relation: b
            object: document:doc
