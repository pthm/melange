# Regression: a relation that imports an excluded relation through a union
# or alias must not flatten past it. ComputeRelationClosure expanded
# can_read: owner or reader through reader: writer but not blocked to writer,
# so the generated check accepted relation IN ('can_read','owner','writer')
# and a blocked writer was allowed can_read, alias and forwarded.
# eligible/can_edit are intersection controls that were already correct.
#
# Each subject (named after its case) holds only the tuples its name lists.
# Mirrors test/check_exclusion_closure_test.go, which also covers check_permission_nw.
#
# Test names are prefixed with "melange/" by the loader.

tests:
  - name: exclusion_closure_boundary
    stages:
      - model: |
          model
            schema 1.1

          type user

          type document
            relations
              define owner: [user]
              define writer: [user]
              define blocked: [user]
              define active: [user]
              define reader: writer but not blocked
              define eligible: writer and active
              define can_read: owner or reader
              define can_edit: owner or eligible
              define alias: reader
              define forwarded: owner or alias
              define writer_override: forwarded or writer
        tuples:
          - user: user:blocked_writer
            relation: writer
            object: document:doc
          - user: user:blocked_writer
            relation: blocked
            object: document:doc
          - user: user:writer
            relation: writer
            object: document:doc
          - user: user:owner
