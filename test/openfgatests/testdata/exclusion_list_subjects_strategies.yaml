# Regression: list_subjects must apply an exclusion on every arm, in every
# list strategy, and must not flatten a parent target's closure past an
# exclusion boundary.
#
# m_dgp/m_gwp/m_all: an exclusion over a union mixing a userset, a TTU and a
# direct or implied branch uses the recursive strategy. UseCTEExclusion made
# its blocks drop their inline exclusion, but only the standard renderer emits
# the compensating anti-join, so blocked direct grants leaked.
#
# a_via_parent: the TTU closure path looked up tuples on falias's satisfying
# relations. Flattened, that leaked fblocked viewers; stopped at freader's
# exclusion boundary, it dropped every viewer. It must evaluate falias.
#
# alice and mallory hold the same grants; mallory is blocked on every path.
#
# Test names are prefixed with "melange/" by the loader.

tests:
  - name: exclusion_list_subjects_strategies
    stages:
      - model: |
          model
            schema 1.1
          type user
          type group
            relations
              define member: [user]
          type folder
            relations
              define viewer: [user]
              define fblocked: [user]
              define freader: viewer but not fblocked
              define falias: freader
          type document
            relations
              define parent: [folder]
              define writer: [user]
              define blocked: [user]
              define via_parent: falias from parent
              define via_parent_direct: freader from parent
              define a_via_parent: via_parent
              define m_dgw: ([user, group#member] or writer) but not blocked
              define a_m_dgw: m_dgw
              define m_dgp: ([user, group#member] or viewer from parent) but not blocked
              define a_m_dgp: m_dgp
              define m_gwp: ([group#member] or writer or viewer from parent) but not blocked
              define a_m_gwp: m_gwp
              define m_dwp: ([user] or writer or viewer from parent) but not blocked
              define a_m_dwp: m_dwp
              define m_gp: ([group#member] or viewer from parent) but not blocked
              define a_m_gp: m_gp
              define m_all: ([user, group#member] or writer or viewer from parent) but not blocked
              define a_m_all: m_all
              define m_dw: ([user] or writer) but not blocked
              define a_m_dw: m_dw
              define m_dg: [user, group#member] but not blocked
              define a_m_dg: m_dg
              define m_gw: ([group#member] or writer) but not blocked
              define a_m_gw: m_gw
              define m_dp: ([user] or viewer from parent) but not blocked
              define a_m_dp: m_dp
              define m_wp: (writer or viewer from parent) but not blocked
              define a_m_wp: m_wp
        tuples:
