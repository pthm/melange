  # A nesting cycle lists each group and member once and terminates.
  - name: nested_group_cycle
    stages:
      - model: |
          model
            schema 1.1
          type user
          type group
            relations
              define member: [user, group#member]
        tuples:
          - user: user:alice
            relation: member
            object: group:a
          - user: group:a#member
            relation: member
            object: group:b
          - user: group:b#member
            relation: member
            object: group:c
          - user: group:c#member
            relation: member
            object: group:a
        listObjectsAssertions:
          - request:
              user: user:alice
              type: group
              relation: member
            expectation:
              - group:a
              - group:b
              - group:c
        listUsersAssertions:
          - request:
              filters:
                - user
              object: group:b
              relation: member
            expectation:
              - user:alice
          - request:
              filters:
                - group#member
              object: group:b
              relation: member
            expectation:
              - group:a#member
              - group:b#member
              - group:c#member
