# Self-referential usersets (group#member on group.member): the depth limit and
# deduplication. OpenFGA fails ListObjects and ListUsers with "resolution too
# complex" (2002) once nesting reaches 25 levels and succeeds at 24; melange's
# breadth-first walks raise M2002 at the same point instead of returning a
# truncated list, and expand each group once, so cycles terminate.
tests:
  # 24 levels of nesting list fully.
  - name: nested_group_depth_limit_24_levels
    stages:
      - model: |
          model
            schema 1.1
          type user
          type group
            relations
              define member: [user, group#member]
        tuples:
          - user: user:alice
            relation: member
            object: group:g0
          - user: group:g0#member
            relation: member
            object: group:g1
