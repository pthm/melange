# Recursive parent walks: the depth limit and deduplication.
#
# OpenFGA fails ListObjects and ListUsers with "resolution too complex" (2002)
# once a parent chain reaches 25 hops and succeeds at 24; melange's
# breadth-first walks raise M2002 at the same point instead of returning
# truncated lists. OpenFGA's Check resolves 25 hops and fails at 26; melange's
# check still fails at 25 (see checkDepthLimit), so only the 26-hop error is
# asserted for Check.
#
# The walk expands each object once, so cycles and objects reachable by
# several paths must still list every object exactly once, and an exclusion
# that gates the walk must hold whichever path reaches an object.
tests:
  - name: recursive_ttu_depth_limit_24_hops
    stages:
      - model: |
          model
            schema 1.1
          type user
          type folder
            relations
              define parent: [folder]
              define editor: [user] or editor from parent
        tuples:
          - user: user:alice
            relation: editor
            object: folder:f0
          - user: folder:f0
            relation: parent
            object: folder:f1
          - user: folder:f1
            relation: parent
            object: folder:f2
          - user: folder:f2
            relation: parent
            object: folder:f3
          - user: folder:f3
            relation: parent
            object: folder:f4
          - user: folder:f4
            relation: parent
            object: folder:f5
          - user: folder:f5
            relation: parent
            object: folder:f6
          - user: folder:f6
            relation: parent
