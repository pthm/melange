  - name: recursive_ttu_walk_overlapping_grants_with_gate
    stages:
      - model: |
          model
            schema 1.1
          type user
          type folder
            relations
              define parent: [folder]
              define blocked: [user]
              define viewer: ([user] or viewer from parent) but not blocked
        # root -> mid -> leaf -> deep, plus a shortcut root -> leaf. alice is
        # granted at root and again at mid, and blocked on mid only: mid is
        # excluded (and passes nothing down), but leaf is still reached
        # through the shortcut and passes viewer on to deep.
        tuples:
          - user: user:alice
            relation: viewer
            object: folder:root
          - user: user:alice
            relation: viewer
            object: folder:mid
          - user: user:alice
            relation: blocked
            object: folder:mid
          - user: folder:root
            relation: parent
            object: folder:mid
          - user: folder:mid
            relation: parent
            object: folder:leaf
          - user: folder:root
            relation: parent
            object: folder:leaf
          - user: folder:leaf
            relation: parent
            object: folder:deep
          - user: folder:mid
            relation: parent
            object: folder:only_via_mid
        checkAssertions:
          - tuple:
              user: user:alice
              relation: viewer
              object: folder:mid
            expectation: false
          - tuple:
              user: user:alice
              relation: viewer
              object: folder:deep
            expectation: true
          - tuple:
              user: user:alice
              relation: viewer
              object: folder:only_via_mid
            expectation: false
        listObjectsAssertions:
          - request:
              user: user:alice
              type: folder
              relation: viewer
            expectation:
              - folder:root
              - folder:leaf
              - folder:deep
  # Two linking relations ("v from parent" through v, "r1 from owner" through
  # r1): the walk follows both from every object and check_permission keeps
  # only the objects that are really accessible. A long chain the subject's
