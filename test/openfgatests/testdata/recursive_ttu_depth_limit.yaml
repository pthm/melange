              - folder:f18
              - folder:f19
              - folder:f20
              - folder:f21
              - folder:f22
              - folder:f23
              - folder:f24
        listUsersAssertions:
          - request:
              filters:
                - user
              object: folder:f24
              relation: editor
            expectation:
              - user:alice
