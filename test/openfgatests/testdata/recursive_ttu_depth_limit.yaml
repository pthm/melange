          - user: folder:f7
            relation: parent
            object: folder:f8
          - user: folder:f8
            relation: parent
            object: folder:f9
          - user: folder:f9
            relation: parent
            object: folder:f10
          - user: folder:f10
            relation: parent
            object: folder:f11
          - user: folder:f11
            relation: parent
            object: folder:f12
          - user: folder:f12
            relation: parent
            object: folder:f13
          - user: folder:f13
            relation: parent
            object: folder:f14
          - user: folder:f14
            relation: parent
            object: folder:f15
          - user: folder:f15
            relation: parent
            object: folder:f16
          - user: folder:f16
            relation: parent
            object: folder:f17
          - user: folder:f17
            relation: parent
            object: folder:f18
          - user: folder:f18
            relation: parent
            object: folder:f19
          - user: folder:f19
            relation: parent
            object: folder:f20
          - user: folder:f20
            relation: parent
            object: folder:f21
          - user: folder:f21
            relation: parent
            object: folder:f22
          - user: folder:f22
            relation: parent
            object: folder:f23
          - user: folder:f23
            relation: parent
            object: folder:f24
        checkAssertions:
          - tuple:
              user: user:alice
              relation: editor
              object: folder:f24
            expectation: true
        listObjectsAssertions:
          - request:
              user: user:alice
              type: folder
              relation: editor
            expectation:
              - folder:f0
              - folder:f1
              - folder:f2
              - folder:f3
              - folder:f4
              - folder:f5
              - folder:f6
              - folder:f7
              - folder:f8
