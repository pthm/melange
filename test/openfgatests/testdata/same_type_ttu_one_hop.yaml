# Same-type tuple-to-userset whose target relation differs from the relation
# being defined ("x: [user] or y from parent", parent: [organization] on
# organization) is a single hop: y on the grandparent grants nothing. The
# Recursive list strategy used to treat any same-type TTU as recursion, so
# list_objects under-reported (no seed for y) and list_subjects over-reported
# (parent_closure read y on every ancestor). Chain: P -> C -> G -> H.
# Every list assertion is also cross-checked against Check (list_check_parity).
#
#   r_one       the reported shape (one hop inside a union)
#   r_rec       genuine recursion, must still reach G and H
#   r_mix       x recurses, y does not: y on P grants x on C, G, H
#   inner/can_x closure over a one-hop relation
#   nested_t    target of r_nest; its own TTU points at a different relation
#   viewer/can_view/r_cv  target that recurses only through an implied relation
#   r_ttu_only  single-arm one hop (Composed strategy)

tests:
  - name: same_type_ttu_one_hop
    stages:
      - model: |
          model
            schema 1.1

          type user

          type organization
            relations
              define parent: [organization]
              define a: [user]
              define b: [user]
              define r_one: [user] or a from parent
              define r_rec: [user] or r_rec from parent
              define r_mix: [user] or r_mix from parent or a from parent
              define inner: [user] or a from parent
              define can_x: inner
              define nested_t: [user] or b from parent
              define r_nest: [user] or nested_t from parent
              define viewer: [user] or viewer from parent
              define can_view: viewer
              define r_cv: [user] or can_view from parent
              define r_ttu_only: a from parent
        tuples:
          - {user: 'organization:P', relation: parent, object: 'organization:C'}
          - {user: 'organization:C', relation: parent, object: 'organization:G'}
          - {user: 'organization:G', relation: parent, object: 'organization:H'}
          - {user: 'user:alice', relation: a, object: 'organization:P'}
          - {user: 'user:alice2', relation: a, object: 'organization:C'}
          - {user: 'user:bob', relation: r_rec, object: 'organization:P'}
          - {user: 'user:carol', relation: r_mix, object: 'organization:P'}
          - {user: 'user:dave', relation: b, object: 'organization:P'}
          - {user: 'user:dave2', relation: nested_t, object: 'organization:P'}
          - {user: 'user:erin', relation: viewer, object: 'organization:P'}
          - {user: 'user:frank', relation: inner, object: 'organization:C'}
        listObjectsAssertions:
          - request: {user: 'user:alice', relation: r_one, type: organization}
            expectation: ['organization:C']
          - request: {user: 'user:alice2', relation: r_one, type: organization}
            expectation: ['organization:G']
          - request: {user: 'user:bob', relation: r_one, type: organization}
            expectation: []
